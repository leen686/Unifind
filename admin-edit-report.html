<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniFind | Admin Edit Report</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="admin-edit-report">
    <header class="main-header">
      <div class="container navbar">
        <a href="index.html" class="logo">
          <img src="images/logo.jpeg" alt="Unified Logo" class="logo-rect" />
        </a>

        <nav class="nav-links nav-links-full">
          <a href="admin-reports.html" class="nav-link-text active-link"
            >All Reports</a
          >
          <a href="login.html" id="adminAuthLink" class="nav-btn primary-btn"
            >Sign Out</a
          >
        </nav>
      </div>
    </header>

    <main class="form-page">
      <div class="container">
        <div class="page-heading">
          <h1>Edit Report</h1>
          <p>Update any report and the changes will appear for all users.</p>
        </div>

        <div class="form-card form-card-wide">
          <form id="adminEditReportForm">
            <div class="form-group">
              <label for="adminEditItemName">Item Name</label>
              <input type="text" id="adminEditItemName" required />
            </div>

            <div class="form-row two-columns">
              <div class="form-group">
                <label for="adminEditCategory">Category</label>
                <select id="adminEditCategory" required>
                  <option value="ID Card">ID Card</option>
                  <option value="Phone">Phone</option>
                  <option value="Wallet">Wallet</option>
                  <option value="Keys">Keys</option>
                  <option value="Bag">Bag</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <div class="form-group">
                <label for="adminEditReportDate">Date</label>
                <input type="date" id="adminEditReportDate" required />
              </div>
            </div>

            <div class="form-group">
              <label for="adminEditLocation">Location</label>
              <input type="text" id="adminEditLocation" required />
            </div>

            <div class="form-group">
              <label for="adminEditDescription">Description</label>
              <textarea id="adminEditDescription" rows="6" required></textarea>
            </div>

            <div class="form-group">
              <label for="adminEditPhone">Phone Number</label>
              <input type="text" id="adminEditPhone" required />
            </div>

            <div class="form-group">
              <label for="adminEditImage">Replace Image</label>
              <input type="file" id="adminEditImage" accept="image/*" />
            </div>

            <button type="submit" class="primary-btn form-btn">
              Save Changes
            </button>
            <p id="adminEditMessage" class="form-message"></p>
          </form>
        </div>
      </div>
    </main>
    <footer class="site-footer clean-footer">
      <div class="container clean-footer-content">
        <h3>
          <span class="footer-dark">Uni</span
          ><span class="footer-blue">Find</span>
        </h3>
        <p>© 2026 UniFind. Built for students, by students.</p>

        <div class="clean-footer-links">
          <a href="#">Privacy</a>
          <a href="#">Terms</a>
          <a href="#">Contact</a>
        </div>
      </div>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
