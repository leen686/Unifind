<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniFind | Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="login">
    <header class="main-header">
      <div class="container navbar">
        <a href="index.html" class="logo">
          <img src="images/logo.jpeg" alt="Unified Logo" class="logo-rect" />
        </a>
        <nav class="nav-links">
          <a href="index.html" class="nav-link-text">Home</a>
          <a href="register.html" class="nav-btn primary-btn">Sign Up</a>
        </nav>
      </div>
    </header>

    <main class="auth-page">
      <div class="container auth-wrapper">
        <div class="auth-card modern-auth-card">
          <h1>Login</h1>
          <p class="auth-subtitle">
            Welcome back! Sign in to access your reports, saved items, and
            profile.
          </p>

          <form id="loginForm">
            <div class="form-group">
              <label for="loginEmail">Email Address</label>
              <div class="input-with-icon">
                <span class="input-icon">✉️</span>
                <input
                  type="email"
                  id="loginEmail"
                  placeholder="Enter your email"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label for="loginPassword">Password</label>
              <div class="input-with-icon">
                <span class="input-icon">🔒</span>
                <input
                  type="password"
                  id="loginPassword"
                  placeholder="Enter your password"
                  required
                />
              </div>
            </div>

            <input type="hidden" id="loginRole" value="user" />

            <div class="login-action-stack">
              <button
                type="button"
                id="loginUserBtn"
                class="primary-btn auth-action-btn"
              >
                Login as User →
              </button>

              <button
                type="button"
                id="loginAdminBtn"
                class="secondary-btn auth-action-btn"
              >
                Login as Admin →
              </button>
            </div>

            <p id="loginMessage" class="form-message"></p>
          </form>

          <p class="auth-footer-text center-text">
            New to UniFind?
            <a href="register.html">Sign up</a>
          </p>

          <div class="mini-info-box">
            <strong>Admin demo account</strong><br />
            Email: admin@unifind.com<br />
            Password: admin123
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer clean-footer">
      <div class="container clean-footer-content">
        <h3>
          <span class="footer-dark">Uni</span
          ><span class="footer-blue">Find</span>
        </h3>
        <p>© 2026 UniFind. Built for students, by students.</p>

        <div class="clean-footer-links">
          <a href="#">Privacy</a>
          <a href="#">Terms</a>
          <a href="#">Contact</a>
        </div>
      </div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
