<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniFind | Register</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="register">
    <header class="main-header">
      <div class="container navbar">
        <a href="index.html" class="logo">
          <div class="logo-box">🔍</div>
          <div class="logo-text">
            <span class="logo-dark">Uni</span>
            <span class="logo-blue">Find</span>
          </div>
        </a>

        <nav class="nav-links">
          <a href="index.html" class="nav-link-text">Home</a>
          <a href="login.html" class="nav-btn secondary-btn">Sign In</a>
        </nav>
      </div>
    </header>

    <main class="auth-page">
      <div class="container auth-wrapper">
        <div class="auth-card">
          <h1>Create Account</h1>
          <p class="auth-subtitle">
            Register to submit reports, save items, and manage your profile.
          </p>

          <form id="registerForm">
            <div class="form-group">
              <label for="registerName">Full Name</label>
              <input
                type="text"
                id="registerName"
                name="registerName"
                placeholder="Enter your full name"
                required
              />
            </div>

            <div class="form-group">
              <label for="registerEmail">University Email</label>
              <input
                type="email"
                id="registerEmail"
                name="registerEmail"
                placeholder="Enter your university email"
                required
              />
            </div>

            <div class="form-group">
              <label for="registerPhone">Phone Number</label>
              <input
                type="text"
                id="registerPhone"
                name="registerPhone"
                placeholder="Enter your phone number"
                required
              />
            </div>

            <div class="form-group">
              <label for="registerPassword">Password</label>
              <input
                type="password"
                id="registerPassword"
                name="registerPassword"
                placeholder="Create a password"
                required
              />
            </div>

            <button type="submit" class="primary-btn form-btn">Sign Up</button>
            <p id="registerMessage" class="form-message"></p>
          </form>

          <p class="auth-footer-text">
            Already have an account?
            <a href="login.html">Sign In</a>
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
