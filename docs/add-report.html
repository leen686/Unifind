<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniFind | Add Report</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body data-page="add-report">
    <header class="main-header">
      <div class="container navbar">
        <a href="index.html" class="logo">
          <img src="images/logo.jpeg" alt="Unified Logo" class="logo-rect" />
        </a>

        <nav class="nav-links nav-links-full">
          <a href="index.html" class="nav-link-text">Home</a>
          <a href="reports.html" class="nav-link-text">Reports</a>
          <a href="add-report.html" class="nav-link-text active-link">Add Report</a>
          <a href="saved.html" class="nav-link-text">Saved</a>
          <a href="my-reports.html" class="nav-link-text">My Reports</a>
          <a href="profile.html" class="nav-link-text">Profile</a>
          <a href="index.html" data-signout class="nav-btn primary-btn">Sign Out</a>
        </nav>
      </div>
    </header>

    <main class="form-page">
      <div class="container">
        <div class="page-heading">
          <h1>Add Item Report</h1>
          <p>Submit a new item report using the structured form below.</p>
        </div>

        <div class="form-card form-card-wide">
          <form id="reportForm" method="POST" enctype="multipart/form-data">
            <div class="form-group">
              <label for="itemName">Item Name</label>
              <input
                type="text"
                id="itemName"
                name="itemName"
                placeholder="Enter item name"
                value=""
                required
              />
            </div>

            <div class="form-row two-columns">
              <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                  <option value="">Select Category</option>
                  <option value="ID Card">ID Card</option><option value="Phone">Phone</option><option value="Wallet">Wallet</option><option value="Keys">Keys</option><option value="Bag">Bag</option><option value="Other">Other</option>
                </select>
              </div>

              <div class="form-group">
                <label for="reportDate">Date</label>
                <input
                  type="date"
                  id="reportDate"
                  name="reportDate"
                  value=""
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label for="location">Location</label>
              <input
                type="text"
                id="location"
                name="location"
                placeholder="Enter location"
                value=""
                required
              />
            </div>

            <div class="form-group">
              <label for="description">Description</label>
              <textarea
                id="description"
                name="description"
                rows="6"
                placeholder="Describe the item clearly"
                required
              ></textarea>
            </div>

            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input
                type="text"
                id="phone"
                name="phone"
                placeholder="Example: 05XXXXXXXX"
                value=""
                required
              />
            </div>

            <div class="form-group">
              <label for="image">Upload Image</label>
              <input type="file" id="image" name="image" accept="image/*" required />
            </div>

            <button type="submit" class="primary-btn form-btn">
              Submit Report
            </button>
          </form>
        </div>
      </div>
    </main>

    <footer class="site-footer clean-footer">
      <div class="container clean-footer-content">
        <h3>
          <span class="footer-dark">Uni</span><span class="footer-blue">Find</span>
        </h3>
        <p>©️ 2026 UniFind. Built for students, by students.</p>

        <div class="clean-footer-links">
          <a href="#">Privacy</a>
          <a href="#">Terms</a>
          <a href="#">Contact</a>
        </div>
      </div>
    </footer>
    <script src="js/seed.js"></script>
    <script src="js/unifind-demo.js"></script>
  </body>
</html>
