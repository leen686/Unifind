<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniFind | Edit Report</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body data-page="edit-report">
    <header class="main-header">
      <div class="container navbar">
        <a href="index.html" class="logo">
          <img src="images/logo.jpeg" alt="Unified Logo" class="logo-rect" />
        </a>

        <nav class="nav-links nav-links-full">
          <a href="index.html" class="nav-link-text">Home</a>
          <a href="reports.html" class="nav-link-text">Reports</a>
          <a href="add-report.html" class="nav-link-text">Add Report</a>
          <a href="saved.html" class="nav-link-text">Saved</a>
          <a href="my-reports.html" class="nav-link-text active-link">My Reports</a>
          <a href="profile.html" class="nav-link-text">Profile</a>
          <a href="index.html" data-signout class="nav-btn primary-btn">Sign Out</a>
        </nav>
      </div>
    </header>

    <main class="form-page">
      <div class="container">
        <div class="page-heading">
          <h1>Edit Report</h1>
          <p>Update your report details when new or corrected information becomes available.</p>
        </div>

        <div class="form-card form-card-wide">
          <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
              <label>Item Name</label>
              <input 
                type="text" 
                name="itemName" 
                value="" 
                required 
              />
            </div>

            <div class="form-row two-columns">
              <div class="form-group">
                <label>Category</label>
                <select name="category" required>
                  <option value="ID Card">ID Card</option><option value="Phone">Phone</option><option value="Wallet">Wallet</option><option value="Keys">Keys</option><option value="Bag">Bag</option><option value="Other">Other</option>
                </select>
              </div>

              <div class="form-group">
                <label>Date</label>
                <input 
                  type="date" 
                  name="reportDate" 
                  value="" 
                  required 
                />
              </div>
            </div>

            <div class="form-group">
              <label>Location</label>
              <input 
                type="text" 
                name="location" 
                value="" 
                required 
              />
            </div>

            <div class="form-group">
              <label>Description</label>
              <textarea name="description" rows="6" required></textarea>
            </div>

            <div class="form-group">
              <label>Phone Number</label>
              <input 
                type="text" 
                name="phone" 
                value="" 
                required 
              />
            </div>

            <div class="form-group">
              <label>Replace Image (optional)</label><br />
              <img 
                src="" 
                alt="Current image" id="currentImage" 
                style="max-width:200px;margin-bottom:10px;border-radius:10px;" 
              />
              <input type="file" name="image" accept="image/*" />
            </div>

            <button type="submit" class="primary-btn form-btn">Save Changes</button>
          </form>
        </div>
      </div>
    </main>

    <footer class="site-footer clean-footer">
      <div class="container clean-footer-content">
        <h3>
          <span class="footer-dark">Uni</span><span class="footer-blue">Find</span>
        </h3>
        <p>©️ 2026 UniFind. Built for students, by students.</p>
        <div class="clean-footer-links">
          <a href="#">Privacy</a>
          <a href="#">Terms</a>
          <a href="#">Contact</a>
        </div>
      </div>
    </footer>
    <script src="js/seed.js"></script>
    <script src="js/unifind-demo.js"></script>
  </body>
</html>
