<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniFind | Profile</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="profile">
    <header class="main-header">
      <div class="container navbar">
        <a href="index.html" class="logo">
          <img src="images/logo.jpeg" alt="Unified Logo" class="logo-rect" />
        </a>

        <nav class="nav-links nav-links-full">
          <a href="index.html" class="nav-link-text">Home</a>
          <a href="reports.html" class="nav-link-text">Reports</a>
          <a href="add-report.html" class="nav-link-text">Add Report</a>
          <a href="saved.html" class="nav-link-text">Saved</a>
          <a href="my-reports.html" class="nav-link-text">My Reports</a>
          <a href="profile.html" class="nav-link-text active-link">Profile</a>
          <a href="login.html" id="authLink" class="nav-btn primary-btn"
            >Sign In</a
          >
        </nav>
      </div>
    </header>

    <main class="form-page">
      <div class="container">
        <div class="page-heading">
          <h1>Profile</h1>
          <p>View your account information and edit it only when needed.</p>
        </div>

        <div class="form-card profile-card">
          <div class="profile-top">
            <div class="profile-avatar">👤</div>
            <div>
              <h2 id="profileDisplayName">Student Profile</h2>
              <p class="profile-subtext">Manage your personal information</p>
            </div>
          </div>

          <form id="profileForm">
            <div class="form-group">
              <label for="profileName">Full Name</label>
              <input type="text" id="profileName" disabled />
            </div>

            <div class="form-group">
              <label for="profileEmail">Email</label>
              <input type="email" id="profileEmail" disabled />
            </div>

            <div class="form-group">
              <label for="profilePhone">Phone Number</label>
              <input type="text" id="profilePhone" disabled />
            </div>

            <div class="profile-actions">
              <button type="button" id="editProfileBtn" class="primary-btn">
                Edit Profile
              </button>
              <button
                type="submit"
                id="saveProfileBtn"
                class="secondary-btn hidden"
              >
                Save Changes
              </button>
            </div>

            <p id="profileMessage" class="form-message"></p>
          </form>

          <button id="logoutBtn" class="secondary-btn form-btn logout-btn">
            Sign Out
          </button>
        </div>
      </div>
    </main>

    <footer class="site-footer clean-footer">
      <div class="container clean-footer-content">
        <h3>
          <span class="footer-dark">Uni</span
          ><span class="footer-blue">Find</span>
        </h3>
        <p>© 2026 UniFind. Built for students, by students.</p>

        <div class="clean-footer-links">
          <a href="#">Privacy</a>
          <a href="#">Terms</a>
          <a href="#">Contact</a>
        </div>
      </div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
