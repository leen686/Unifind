<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniFind | Reports</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="reports">
    <header class="main-header">
      <div class="container navbar">
        <a href="index.html" class="logo">
          <img src="images/logo.jpeg" alt="Unified Logo" class="logo-rect" />
        </a>

        <nav class="nav-links nav-links-full">
          <a href="index.html" class="nav-link-text">Home</a>
          <a href="reports.html" class="nav-link-text active-link">Reports</a>
          <a href="add-report.html" class="nav-link-text">Add Report</a>
          <a href="saved.html" class="nav-link-text">Saved</a>
          <a href="my-reports.html" class="nav-link-text">My Reports</a>
          <a href="profile.html" class="nav-link-text">Profile</a>
          <a href="login.html" id="authLink" class="nav-btn primary-btn"
            >Sign In</a
          >
        </nav>
      </div>
    </header>

    <main class="reports-page">
      <div class="container">
        <div class="page-heading">
          <h1>All Reports</h1>
          <p>
            Browse all reports in one place and use search, category filtering,
            and time sorting to find relevant items.
          </p>
        </div>

        <section class="filters-box">
          <div class="filter-group">
            <label for="searchInput">Search by Keyword</label>
            <div class="search-input-wrap">
              <span class="search-icon">🔍</span>
              <input
                type="text"
                id="searchInput"
                placeholder="Search item name, description, or location"
              />
            </div>
          </div>

          <div class="filter-group">
            <label for="categoryFilter">Category</label>
            <select id="categoryFilter">
              <option value="all">All Categories</option>
              <option value="ID Card">ID Card</option>
              <option value="Phone">Phone</option>
              <option value="Wallet">Wallet</option>
              <option value="Keys">Keys</option>
              <option value="Bag">Bag</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="sortFilter">Sort by Time</label>
            <select id="sortFilter">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
            </select>
          </div>
        </section>

        <section>
          <div id="reportsList" class="reports-grid"></div>
        </section>
      </div>
    </main>

    <footer class="site-footer clean-footer">
      <div class="container clean-footer-content">
        <h3>
          <span class="footer-dark">Uni</span
          ><span class="footer-blue">Find</span>
        </h3>
        <p>© 2026 UniFind. Built for students, by students.</p>

        <div class="clean-footer-links">
          <a href="#">Privacy</a>
          <a href="#">Terms</a>
          <a href="#">Contact</a>
        </div>
      </div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
