<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniFind | Reports</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="reports">
    <header class="main-header">
      <div class="container navbar">
        <a href="index.html" class="logo">
          <div class="logo-box">🔍</div>
          <div class="logo-text">
            <span class="logo-dark">Uni</span>
            <span class="logo-blue">Find</span>
          </div>
        </a>

        <nav class="nav-links nav-links-full">
          <a href="index.html" class="nav-link-text">Home</a>
          <a href="reports.html" class="nav-link-text active-link">Reports</a>
          <a href="add-report.html" class="nav-link-text">Add Report</a>
          <a href="saved.html" class="nav-link-text">Saved</a>
          <a href="my-reports.html" class="nav-link-text">My Reports</a>
          <a href="profile.html" class="nav-link-text">Profile</a>
          <a href="login.html" id="authLink" class="nav-btn secondary-btn"
            >Sign In</a
          >
        </nav>
      </div>
    </header>

    <main class="reports-page">
      <div class="container">
        <div class="page-heading">
          <h1>All Reports</h1>
          <p>
            Browse all reports in one place and use search, category filtering,
            and time sorting to find relevant items.
          </p>
        </div>

        <section class="filters-box">
          <div class="filter-group">
            <label for="searchInput">Search by Keyword</label>
            <input
              type="text"
              id="searchInput"
              placeholder="Search item name, description, or location"
            />
          </div>

          <div class="filter-group">
            <label for="categoryFilter">Category</label>
            <select id="categoryFilter">
              <option value="all">All Categories</option>
              <option value="ID Card">ID Card</option>
              <option value="Phone">Phone</option>
              <option value="Wallet">Wallet</option>
              <option value="Keys">Keys</option>
              <option value="Bag">Bag</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="sortFilter">Sort by Time</label>
            <select id="sortFilter">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
            </select>
          </div>
        </section>

        <section>
          <div id="reportsList" class="reports-grid"></div>
        </section>
      </div>
    </main>
  </body>
</html>
