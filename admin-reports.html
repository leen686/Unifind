<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniFind | Admin Reports</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="admin-reports">
    <header class="main-header">
      <div class="container navbar">
        <a href="index.html" class="logo">
          <div class="logo-box">🛠️</div>
          <div class="logo-text">
            <span class="logo-dark">Uni</span>
            <span class="logo-blue">Find Admin</span>
          </div>
        </a>

        <nav class="nav-links nav-links-full">
          <a href="admin-dashboard.html" class="nav-link-text">Dashboard</a>
          <a href="admin-reports.html" class="nav-link-text active-link"
            >All Reports</a
          >
          <a href="login.html" id="adminAuthLink" class="nav-btn secondary-btn"
            >Sign Out</a
          >
        </nav>
      </div>
    </header>

    <main class="reports-page">
      <div class="container">
        <div class="page-heading">
          <h1>Manage All Reports</h1>
          <p>
            Review, search, sort, edit, and delete all reports across the
            platform.
          </p>
        </div>

        <section class="filters-box">
          <div class="filter-group">
            <label for="adminSearchInput">Search by Keyword</label>
            <input
              type="text"
              id="adminSearchInput"
              placeholder="Search item name, description, or location"
            />
          </div>

          <div class="filter-group">
            <label for="adminCategoryFilter">Category</label>
            <select id="adminCategoryFilter">
              <option value="all">All Categories</option>
              <option value="ID Card">ID Card</option>
              <option value="Phone">Phone</option>
              <option value="Wallet">Wallet</option>
              <option value="Keys">Keys</option>
              <option value="Bag">Bag</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="adminSortFilter">Sort by Time</label>
            <select id="adminSortFilter">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
            </select>
          </div>
        </section>

        <section>
          <div id="adminReportsList" class="reports-grid"></div>
        </section>
      </div>
    </main>
    <footer class="site-footer">
      <div class="container footer-content">
        <p>© 2026 UniFind. All rights reserved.</p>
        <p>Lost &amp; Found platform for university students.</p>
      </div>
    </footer>
  </body>
</html>
