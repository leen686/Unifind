<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniFind | Admin Reports</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="admin-reports">
    <header class="main-header">
      <div class="container navbar">
        <a href="index.html" class="logo">
          <div class="logo-box">🛠️</div>
          <div class="logo-text">
            <span class="logo-dark">Uni</span>
            <span class="logo-blue">Find Admin</span>
          </div>
        </a>

        <nav class="nav-links nav-links-full">
          <a href="admin-dashboard.html" class="nav-link-text">Dashboard</a>
          <a href="admin-reports.html" class="nav-link-text active-link"
            >All Reports</a
          >
          <a href="login.html" id="adminAuthLink" class="nav-btn primary-btn"
            >Sign Out</a
          >
        </nav>
      </div>
    </header>

    <main class="reports-page">
      <div class="container">
        <div class="page-heading">
          <h1>Manage All Reports</h1>
          <p>Search, sort, edit, and delete all reports in the platform.</p>
        </div>

        <section class="filters-box">
          <div class="filter-group">
            <label for="adminSearchInput">Search by Keyword</label>
            <div class="search-input-wrap">
              <span class="search-icon">🔍</span>
              <input
                type="text"
                id="adminSearchInput"
                placeholder="Search item name, description, or location"
              />
            </div>
          </div>

          <div class="filter-group">
            <label for="adminCategoryFilter">Category</label>
            <select id="adminCategoryFilter">
              <option value="all">All Categories</option>
              <option value="ID Card">ID Card</option>
              <option value="Phone">Phone</option>
              <option value="Wallet">Wallet</option>
              <option value="Keys">Keys</option>
              <option value="Bag">Bag</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="adminSortFilter">Sort by Time</label>
            <select id="adminSortFilter">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
            </select>
          </div>
        </section>

        <section>
          <div id="adminReportsList" class="reports-grid"></div>
        </section>
      </div>
    </main>

    <footer class="site-footer clean-footer">
      <div class="container clean-footer-content">
        <h3>
          <span class="footer-dark">Uni</span
          ><span class="footer-blue">Find</span>
        </h3>
        <p>© 2026 UniFind. Built for students, by students.</p>
        <div class="clean-footer-links">
          <a href="#">Privacy</a>
          <a href="#">Terms</a>
          <a href="#">Contact</a>
        </div>
      </div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
