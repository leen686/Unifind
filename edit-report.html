<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniFind | Edit Report</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="edit-report">
    <header class="main-header">
      <div class="container navbar">
        <a href="index.html" class="logo">
          <img src="images/logo.jpeg" alt="Unified Logo" class="logo-rect" />
        </a>

        <nav class="nav-links nav-links-full">
          <a href="index.html" class="nav-link-text">Home</a>
          <a href="reports.html" class="nav-link-text">Reports</a>
          <a href="add-report.html" class="nav-link-text">Add Report</a>
          <a href="saved.html" class="nav-link-text">Saved</a>
          <a href="my-reports.html" class="nav-link-text active-link"
            >My Reports</a
          >
          <a href="profile.html" class="nav-link-text">Profile</a>
          <a href="login.html" id="authLink" class="nav-btn primary-btn"
            >Sign In</a
          >
        </nav>
      </div>
    </header>

    <main class="form-page">
      <div class="container">
        <div class="page-heading">
          <h1>Edit Report</h1>
          <p>
            Update your report details when new or corrected information becomes
            available.
          </p>
        </div>

        <div class="form-card form-card-wide">
          <form id="editReportForm">
            <div class="form-group">
              <label for="editItemName">Item Name</label>
              <input type="text" id="editItemName" required />
            </div>

            <div class="form-row two-columns">
              <div class="form-group">
                <label for="editCategory">Category</label>
                <select id="editCategory" required>
                  <option value="ID Card">ID Card</option>
                  <option value="Phone">Phone</option>
                  <option value="Wallet">Wallet</option>
                  <option value="Keys">Keys</option>
                  <option value="Bag">Bag</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <div class="form-group">
                <label for="editReportDate">Date</label>
                <input type="date" id="editReportDate" required />
              </div>
            </div>

            <div class="form-group">
              <label for="editLocation">Location</label>
              <input type="text" id="editLocation" required />
            </div>

            <div class="form-group">
              <label for="editDescription">Description</label>
              <textarea id="editDescription" rows="6" required></textarea>
            </div>

            <div class="form-group">
              <label for="editPhone">Phone Number</label>
              <input type="text" id="editPhone" required />
            </div>

            <div class="form-group">
              <label for="editImage">Replace Image</label>
              <input type="file" id="editImage" accept="image/*" />
            </div>

            <button type="submit" class="primary-btn form-btn">
              Save Changes
            </button>
            <p id="editMessage" class="form-message"></p>
          </form>
        </div>
      </div>
    </main>

    <footer class="site-footer clean-footer">
      <div class="container clean-footer-content">
        <h3>
          <span class="footer-dark">Uni</span
          ><span class="footer-blue">Find</span>
        </h3>
        <p>© 2026 UniFind. Built for students, by students.</p>

        <div class="clean-footer-links">
          <a href="#">Privacy</a>
          <a href="#">Terms</a>
          <a href="#">Contact</a>
        </div>
      </div>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
